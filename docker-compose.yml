services:
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: ai_face_alert
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db/ai_face_alert
      HEADLESS: "true"
    volumes:
      - ./known_faces:/app/known_faces
      - insightface_models:/root/.insightface
    restart: unless-stopped

volumes:
  postgres_data:
  insightface_models:
